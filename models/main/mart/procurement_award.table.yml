schema: main
name: procurement_award
title: 落札実績（政府電子調達 GEPS）
description: |-
  中央省庁等の落札実績です。1 行が 1 件の落札で、落札決定日・落札価格・府省・入札方式・落札事業者（商号と法人番号）を持ちます。2017 年度以降です。

  - 複数の事業者が落札する案件があるため、procurement_item_no は一意ではありません
  - 個人事業主は corporate_number が NULL で、オープンカウンタ（少額）の個人事業主は含みません
keywords:
  - 調達ポータル
  - 政府調達
  - 落札実績
  - 入札
  - 法人番号
published: true
sources:
  - path: https://www.p-portal.go.jp/pps-web-biz/UAB02/OAB0201
fields:
  - name: procurement_item_no
    title: 調達案件番号
  - name: procurement_item_name
    title: 調達案件名称
  - name: award_date
    title: 落札決定日
  - name: fiscal_year
    title: 会計年度（落札決定日基準・4月始まり）
  - name: award_price
    title: 落札価格（円）
  - name: ministry_code
    title: 府省コード
  - name: ministry_name
    title: 府省名称
  - name: bidding_method_code
    title: 入札方式コード
  - name: bidding_method_name
    title: 入札方式名称
  - name: trade_name
    title: 商号又は名称（落札事業者）
  - name: corporate_number
    title: 法人番号
    description: 落札事業者の法人番号（13 桁）。個人事業主などは NULL
    semantic: { role: entity, name: corporate_number }
